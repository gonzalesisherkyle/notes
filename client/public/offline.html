<!-- client/public/offline.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121413" />
    <title>Quiet Scribe Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #121413;
        color: #e2e3e1;
        font-family: Inter, system-ui, sans-serif;
      }

      main {
        width: min(520px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 36px;
      }

      p {
        margin: 0;
        color: #c1c8c1;
        line-height: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Your saved notes remain available on this device. New changes will sync when the connection returns.</p>
    </main>
  </body>
</html>
